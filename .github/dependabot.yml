# Weekly checks for security fixes and new versions of the tools and GitHub Actions
# this project uses. Dependabot opens a pull request; the test workflow runs on it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
