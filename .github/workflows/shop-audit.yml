name: Audit shops for the price scout
# Run by hand: checks each directory shop's robots.txt, terms of service and public
# collection list (titles and counts only), and commits data/stores/scout-audit.json.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/shop-audit.ts
      - name: Save the report
        run: |
          git config user.name "setkeeper-scout"
          git config user.email "scout@users.noreply.github.com"
          git add data/stores/scout-audit.json
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Shop audit for the price scout $(date -u +%F)"
          git pull --rebase && git push
