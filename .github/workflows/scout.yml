name: Price, grading and new-set scout
on:
  schedule:
    - cron: "17 10 * * *"   # daily, 3:17 am Pacific
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: USD and EUR to CAD rates (Bank of Canada)
        run: node scripts/fx.ts
        continue-on-error: true
      - name: Shop listings and condition discounts
        run: node scripts/scout.ts
        continue-on-error: true
        env:
          # price history goes to the private Supabase table, never into this public repo
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_SELLERS: ${{ secrets.SCOUT_SELLERS }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Daily card prices, every printing (private history in Supabase)
        run: node scripts/price-history.ts
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Grading tiers (PSA, Beckett, CGC, TAG)
        run: node scripts/grading-scout.ts
        continue-on-error: true
      - name: New sets from the official card galleries
        run: |
          # tcg.pokemon.com has a bot check; the scout falls back to headless Chromium if plain requests are blocked
          npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          node scripts/gallery-scout.ts
        continue-on-error: true
      - name: Keep the Supabase project awake
        if: ${{ vars.SUPABASE_URL != '' }}
        run: |
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/keepalive" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}'
        continue-on-error: true
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "setkeeper-scout"
          git config user.email "scout@users.noreply.github.com"
          git add data/grading data/galleries data/landed data/prices
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Update prices, grading tiers and sets $(date -u +%F)"
          git push
          # pushes made by this workflow don't trigger other workflows, so start the deploy directly
          gh workflow run pages.yml --ref main
